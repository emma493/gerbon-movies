<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">
  <title>Video pipeline test | Favmoney</title>
  <style>
    html,body{background:#000;color:#fff;font-family:system-ui,sans-serif;margin:0;padding:16px;}
    video{width:100%;max-width:480px;display:block;background:#111;border-radius:12px;}
    pre{background:#111;border:1px solid #333;border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-all;font-size:12px;}
    .ok{color:#4ade80;} .bad{color:#f87171;} .dim{color:#9ca3af;}
  </style>
</head>
<body>
  <h1 style="font-size:18px;">Video pipeline test</h1>
  <p class="dim">Fetches ONE video link via plain HTTPS (no SDK, no app code) and plays it.</p>
  <video id="v" controls muted playsinline preload="auto"></video>
  <h2 style="font-size:14px;">Log</h2>
  <pre id="log"></pre>
  <script>
    (function () {
      var logEl = document.getElementById("log");
      var video = document.getElementById("v");
      function log(msg, cls) {
        var line = document.createElement("div");
        if (cls) line.className = cls;
        line.textContent = new Date().toISOString().slice(11, 23) + " " + msg;
        logEl.appendChild(line);
      }
      ["loadstart", "progress", "canplay", "playing", "waiting", "stalled", "suspend", "emptied"].forEach(function (ev) {
        video.addEventListener(ev, function () { log("video event: " + ev, ev === "playing" || ev === "canplay" ? "ok" : ""); });
      });
      video.addEventListener("error", function () {
        var e = video.error;
        log("video ERROR: code=" + (e && e.code) + " message=" + (e && e.message), "bad");
      });
      var t0 = Date.now();
      var params = new URLSearchParams(location.search);
      var forced = params.get("u");
      if (forced) {
        log("manual url override", "ok");
        playUrl("manual", forced);
        return;
      }
      log("fetching video list...");
      fetch("https://firestore.googleapis.com/v1/projects/shortxx-app/databases/(default)/documents/videos?pageSize=5&key=AIzaSyAcmxtdjT80jKyq4vuC0z6sd9AfS2zGE0w")
        .then(function (res) {
          log("list HTTP " + res.status + " in " + (Date.now() - t0) + "ms", res.ok ? "ok" : "bad");
          if (!res.ok) {
            return res.text().then(function (body) {
              log("error body: " + body.slice(0, 2000), "bad");
              throw new Error("list status " + res.status);
            });
          }
          return res.json();
        })
        .then(function (json) {
          var docs = (json && json.documents) || [];
          log("docs returned: " + docs.length, docs.length ? "ok" : "bad");
          var pick = null;
          for (var i = 0; i < docs.length; i++) {
            var f = docs[i].fields || {};
            if (f.is_active && (f.is_active.booleanValue === true || f.is_active.booleanValue === "true") &&
                f.direct_url && f.direct_url.stringValue) {
              pick = { id: String((docs[i].name || "").split("/").pop()), url: f.direct_url.stringValue };
              break;
            }
          }
          if (!pick) { log("no active video with direct_url found", "bad"); return; }
          playUrl(pick.id, pick.url);
        })
        .catch(function (e) {
          log("FETCH FAILED: " + (e && e.message), "bad");
        });
      function playUrl(id, url) {
          log("picked id=" + id, "ok");
          log("url=" + url, "");
          video.src = url;
          video.load();
          var p = video.play();
          if (p && p.catch) p.catch(function (e) { log("play() rejected: " + e, "bad"); });
          log("src set, play() called", "ok");
      }
    })();
  </script>
</body>
</html>
